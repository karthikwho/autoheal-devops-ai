[project]
name = "autoheal-devops-ai"
version = "0.1.0"
description = "An AI-assisted, self-healing CI/CD pipeline that detects, diagnoses and safely repairs delivery failures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
autoheal-contracts = { workspace = true }
autoheal-api = { workspace = true }
autoheal-diagnosis = { workspace = true }

[dependency-groups]
dev = [
    "autoheal-contracts",
    "autoheal-api",
    "autoheal-diagnosis",
    "httpx2>=2.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "contracts: contract model validation tests",
    "api: FastAPI endpoint tests",
    "diagnosis: deterministic and optional-LLM diagnosis engine tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Documentation holds deliberately aligned code blocks and ASCII diagrams.
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `Depends()` in argument defaults.
"apps/api/src/**" = ["B008"]
