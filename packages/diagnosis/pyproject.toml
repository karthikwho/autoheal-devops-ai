[project]
name = "autoheal-diagnosis"
version = "0.1.0"
description = "Evidence-backed CI/CD failure diagnosis for AutoHeal DevOps AI (Member 2)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autoheal-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoheal_diagnosis"]

[tool.uv.sources]
autoheal-contracts = { workspace = true }
