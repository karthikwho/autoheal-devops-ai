[project]
name = "autoheal-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts for AutoHeal DevOps AI (FailureEvent, DiagnosisResult, ValidationResult, IncidentRecord)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoheal_contracts"]
