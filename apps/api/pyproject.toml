[project]
name = "autoheal-api"
version = "0.1.0"
description = "FastAPI service exposing the AutoHeal incident lifecycle."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "autoheal-contracts",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[dependency-groups]
test = ["httpx2>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoheal_api"]

[tool.uv.sources]
autoheal-contracts = { workspace = true }
